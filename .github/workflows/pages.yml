name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deployments must not overlap, and one already running should finish rather than be cancelled
# half way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

# Default to read-only. The build job needs no more than this plus read access to the Pages
# settings; only the deploy job is granted the write and OIDC scopes.
permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages settings to confirm the site is enabled
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Reads "packageManager" (bun@x.y.z) from package.json, so Bun is pinned in one place.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The project site lives under /ISS-edu/, so every asset URL needs that prefix.
      - name: Build
        run: bun run build
        env:
          BASE_PATH: /ISS-edu/

      # Fails fast if the base path ever stops reaching the built HTML, which would deploy a blank page.
      - name: Check the base path
        run: |
          set -euo pipefail
          grep -q '/ISS-edu/assets/' dist/index.html

      # GitHub Pages has no SPA fallback of its own: it serves 404.html for unknown paths, so a
      # copy of index.html lets the router handle deep links.
      - name: Add the SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write # publish the uploaded artefact as the Pages site
      id-token: write # deploy-pages verifies the deployment source with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
