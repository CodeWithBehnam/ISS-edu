name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: nothing in CI needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Reads "packageManager" (bun@x.y.z) from package.json, so Bun is pinned in one place.
          bun-version-file: package.json

      # --frozen-lockfile fails the job if bun.lock and package.json have drifted apart.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  container:
    name: Container image and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag iss-edu:ci .

      # Starting the stack through compose.yaml proves the file itself works, including its
      # read-only filesystem, dropped capabilities and healthcheck. --wait blocks until healthy.
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Smoke test
        run: |
          set -euo pipefail
          # compose.yaml publishes the port on 127.0.0.1 only, so address it by IPv4 directly.
          base=http://127.0.0.1:8080

          # Capture bodies first: `grep -q` exiting early would otherwise SIGPIPE curl under pipefail.
          echo "Page is served"
          page=$(curl -fsS "$base/")
          grep -q 'id="root"' <<< "$page"

          echo "Client-side routes fall back to index.html"
          route=$(curl -fsS "$base/some/deep/link")
          grep -q 'id="root"' <<< "$route"

          echo "Hashed assets are cached as immutable"
          asset=$(grep -o -m1 '/assets/[^"]*\.js' <<< "$page")
          curl -fsSI "$base$asset" | grep -i '^cache-control: .*immutable'

          echo "Models are served as glTF binary"
          curl -fsSI "$base/models/iss.glb" | grep -i '^content-type: model/gltf-binary'

          echo "Country data is served as JSON"
          curl -fsSI "$base/data/countries-110m.json" | grep -i '^content-type: application/json'

          # nginx drops inherited headers in any location that sets its own, so check the
          # health probe as well as the page.
          echo "Security headers are present"
          for path in / /healthz; do
            headers=$(curl -fsSI "$base$path")
            for name in \
              content-security-policy \
              x-content-type-options \
              x-frame-options \
              referrer-policy \
              permissions-policy; do
              grep -i "^$name:" <<< "$headers" || { echo "missing header on $path: $name"; exit 1; }
            done
          done

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
