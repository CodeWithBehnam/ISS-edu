# Security headers shared by every location in default.conf.
#
# The Content-Security-Policy matches the <meta> tag that vite.config.ts injects
# into production builds, plus frame-ancestors, which browsers ignore in a <meta>
# tag. 'wasm-unsafe-eval' is needed because the meshopt model decoder in
# three-stdlib instantiates WebAssembly. 'unsafe-inline' for styles covers the
# style attributes React and the 3D canvas set at runtime. There is deliberately
# no upgrade-insecure-requests, because it breaks plain http://localhost.
#
# No Strict-Transport-Security here: this container speaks plain HTTP. Add HSTS
# at the TLS-terminating proxy if you put one in front of it.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://upload.wikimedia.org; connect-src 'self' https://celestrak.org https://api.wheretheiss.at https://corquaid.github.io; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
