# Static hosting for the built ISS tracker. Replaces the default server block of
# nginxinc/nginx-unprivileged, which runs as a non-root user, listens on 8080 and
# only ever writes under /tmp, so the container can use a read-only root filesystem.
#
# Every response header comes from snippets/security-headers.conf. nginx drops
# inherited add_header directives as soon as a location sets its own, so each
# location below that sets Cache-Control includes the snippet again.

# Compress the text formats Vite emits. The GLB models are already meshopt
# compressed and are deliberately left out. text/html is always compressed.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    image/svg+xml
    text/css
    text/plain;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Do not advertise the nginx version in headers or error pages.
    server_tokens off;

    # The published host port may differ from 8080, so redirects stay relative.
    absolute_redirect off;

    include snippets/security-headers.conf;

    # Liveness probe for the compose healthcheck. Not logged, never cached.
    location = /healthz {
        include snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Vite output with a content hash in the file name: safe to cache for a year.
    location /assets/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 3D models. The names are not hashed, so browsers must revalidate (ETag).
    # nginx has no MIME type for .glb, so default_type supplies the right one.
    location /models/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        default_type model/gltf-binary;
        try_files $uri =404;
    }

    # Natural Earth country polygons. Same revalidation rule as the models.
    location /data/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hidden files are never part of the build output; answer 404, not 403, so
    # their existence is not confirmed.
    location ~ /\. {
        return 404;
    }

    # The single page app shell and any other root file. Unknown paths fall back
    # to index.html so client-side routes survive a reload.
    location / {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
