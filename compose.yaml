# Run the ISS tracker locally in a hardened container:
#
#   podman compose up --build      (or: docker compose up --build)
#
# then open http://localhost:8080. Stop with Ctrl+C, remove with `compose down`.
#
# Optional environment variables:
#   ISS_PORT          host port to publish (default 8080)
#   ISS_BIND_ADDRESS  host address to bind (default 127.0.0.1, this machine only;
#                     set 0.0.0.0 to share the app with other devices on your network)

services:
  iss-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: iss-edu:local
    ports:
      - "${ISS_BIND_ADDRESS:-127.0.0.1}:${ISS_PORT:-8080}:8080"
    restart: unless-stopped

    # The site is static, so nothing in the container needs to be writable except
    # nginx's pid file and temporary directories, which live under /tmp.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
